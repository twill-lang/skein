# skein, read by spool. The subset spool parses is comments, one-level tables,
# quoted strings and single-line inline tables, and this file stays inside it.
name = "skein"
version = "0.1.0"

# Documentation only. twill has no package entry point, so spool records this
# and shows it in `spool list`; it does not enforce it. `src/encoding.tw` is
# named rather than a model, because the encoding is what a caller reaches for
# first and every model is reached through it.
entry = "src/encoding.tw"

[dependencies]
# The language itself, pinned to the release whose std/text and std/nn this
# source was written against. spool has no notion of a toolchain dependency, so
# it is declared as an ordinary git dependency: the version is the thing that
# matters and vendoring the twill tree does no harm. It is a real dependency
# rather than an assumption because skein calls std/text on every code path and
# hands ids to std/nn's embedding, and a change to either is a change to what
# this package does.
twill = { version = "^1.2.0", git = "https://github.com/martin-k-m/twill" }
